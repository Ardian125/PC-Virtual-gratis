name: GitHub Actions RDP Tailscale

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    steps:
      - name: Install & Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            Write-Error "Secret TAILSCALE_AUTHKEY tidak ditemukan atau kosong di Settings GitHub!"
            exit 1
          }
          choco install tailscale -y
          $env:Path += ";C:\Program Files\Tailscale"
          tailscale up --authkey "$env:TAILSCALE_AUTHKEY" --unattended

      - name: Enable RDP & Configure User
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          $admin = [ADSI]"WinNT://./runneradmin,user"
          $admin.SetPassword("PasswordRDP123!")

      - name: Keep Alive
        shell: powershell
        run: |
          $i = 0
          while ($i -lt 360) {
            Start-Sleep -Seconds 60
            $i++
          }
          
