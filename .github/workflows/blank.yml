name: Windows RDP High Performance

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Download & Install Tailscale
      run: |
        choco install tailscale -y

    - name: Connect to Tailscale
      run: |
        & "C:\Program Files\Tailscale\tailscale.exe" up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }} --accept-routes

    - name: Optimize CPU & Graphics Settings
      run: |
        powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
        Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\DirectX' -Name "UserGpuPreferences" -Value 2 -ErrorAction SilentlyContinue
        Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "bEnumerateGpu" -Value 1 -ErrorAction SilentlyContinue

    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    - name: Create RDP User
      run: |
        net user VirtualUser Pass12345678! /add
        net localgroup administrators VirtualUser /add

    - name: Keep Active (Max 6 Hours Limit)
      run: |
        $seconds = 21600
        Start-Sleep -Seconds $seconds
        
