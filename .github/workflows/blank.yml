#.github/workflows/main.yml
name: Windows - Ngrok

on: workflow_dispatch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
  RDP_USER: admin
  RDP_PASS: p@ssw0rd!

jobs:
  ngrok-rdp:
    runs-on: windows-latest
    timeout-minutes: False

    steps:
    - name: Setup Windows Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

        if ("$env:RDP_USER" -eq "runneradmin") {
          Write-Host "Warning: Using default user account!"
          Set-LocalUser -Name $env:RDP_USER -Password (ConvertTo-SecureString "$env:RDP_PASS" -AsPlainText -Force)
        } else {
          New-LocalUser -Name "$env:RDP_USER" -Password (ConvertTo-SecureString "$env:RDP_PASS" -AsPlainText -Force) *>$null
          Add-LocalGroupMember -Group "Administrators" -Member "$env:RDP_USER"
          Enable-LocalUser -Name "$env:RDP_USER"
        }
        
        icacls "C:\Windows\Temp" /grant "$env:RDP_USER`:F" *>$null
        icacls "C:\Windows\installer" /grant "$env:RDP_USER`:F" *>$null

        Set-Service -Name "W32Time" -StartupType Automatic -ErrorAction Stop *>$null
        Restart-Service W32Time *>$null
        w32tm /resync /force *>$null
        w32tm /config /manualpeerlist:"time.windows.com" /syncfromflags:manual /reliable:yes /update *>$null
        
        diskperf -Y *>$null
        
        Get-ChildItem -Path "$env:TEMP" -Recurse -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
        Get-ChildItem -Path "C:\Windows\Temp" -Recurse -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
        
        (New-Object -ComObject Shell.Application).minimizeall()

    - name: Download Ngrok
      run: |
        Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
        Expand-Archive ngrok.zip -DestinationPath .

    - name: Start Ngrok & Display Info
      run: |
        if (-not $env:NGROK_AUTH_TOKEN) {
          throw "ERROR: NGROK_AUTH_TOKEN tidak ditemukan di GitHub Secrets!"
        }

        # Jalankan ngrok langsung dengan authtoken
        Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389 --authtoken $env:NGROK_AUTH_TOKEN" -WindowStyle Hidden
        
        $ngrokUrl = $null
        $attempts = 0

        while (-not $ngrokUrl -and $attempts -lt 12) {
          Start-Sleep -Seconds 5
          $attempts++
          try {
            $tunnels = Invoke-RestMethod -Uri http://localhost:4040/api/tunnels
            $ngrokUrl = ($tunnels.tunnels | Where-Object { $_.proto -eq 'tcp' }).public_url
          } catch {
            Write-Host "Menunggu Ngrok terhubung... (Coba ke-$attempts)"
          }
        }

        if ($ngrokUrl) {
          $cleanUrl = $ngrokUrl -replace "^tcp://", ""
          Write-Host "=========================================="
          Write-Host "RDP BERHASIL DIAKTIFKAN!"
          Write-Host "URL Remote : $cleanUrl"
          Write-Host "Username   : $env:RDP_USER"
          Write-Host "Password   : $env:RDP_PASS"
          Write-Host "=========================================="
        } else {
          throw "Gagal mendapatkan URL dari Ngrok. Periksa apakah NGROK_AUTH_TOKEN Anda valid."
        }

    - name: Keep Alive
      run: |
        $duration = 21600  # 6 jam
        $interval = 300
        $endTime = (Get-Date).AddSeconds($duration)

        while ((Get-Date) -lt $endTime) {
          $ngrokProcess = Get-Process -Name "ngrok" -ErrorAction SilentlyContinue
          if (-not $ngrokProcess) {
            Write-Host "Proses Ngrok terhenti. Menghentikan workflow."
            exit 1
          }
          Start-Sleep -Seconds $interval
        }

    - name: Cleanup
      if: always()
      run: |
        Get-Process -Name "ngrok" -ErrorAction SilentlyContinue | Stop-Process -Force
        
