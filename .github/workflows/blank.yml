name: Windows RDP Auto-Config

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Download & Setup Ngrok
      run: |
        choco install ngrok -y
        
    - name: Connect Ngrok Account
      run: |
        ngrok authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
        
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        
    - name: Create Custom RDP User
      run: |
        net user VirtualUser Pass12345678! /add
        net localgroup administrators VirtualUser /add
        
    - name: Start Ngrok Tunnel
      run: |
        Start-Process Powershell -ArgumentList '-Noexit -Command "ngrok tcp 3389"'
        
    - name: Keep Active (Never)
      run: |
        $seconds = Never
        Start-Sleep -Seconds $seconds
