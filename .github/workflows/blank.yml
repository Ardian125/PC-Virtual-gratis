name: RDP Windows High Performance (No Ribet)

on:
  workflow_dispatch:
    inputs:
      tailscale_key:
        description: 'Tempelkan Auth Key Tailscale di sini (tskey-auth-...)'
        required: true
        type: string

jobs:
  rdp:
    runs-on: windows-2022
    steps:
      - name: Windows High Performance Tweaks & RDP Setup
        shell: powershell
        run: |
          Write-Host "[1/3] Mengaktifkan Mode High Performance & RDP..."
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name "VisualFXSetting" -Value 2
          
          New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT' -Name 'Terminal Services' -Force -ErrorAction SilentlyContinue | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' -Name "DWMFRAMEINTERVAL" -PropertyType DWord -Value 15 -Force | Out-Null
          
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          
          $admin = [ADSI]"WinNT://./runneradmin,user"
          $admin.SetPassword("PasswordRDP123!")

      - name: Install & Connect Tailscale
        shell: powershell
        run: |
          Write-Host "[2/3] Menginstall Tailscale via Winget..."
          $key = "${{ github.event.inputs.tailscale_key }}"
          
          if ([string]::IsNullOrWhiteSpace($key)) {
            Write-Error "ERROR: Auth Key Tailscale belum dimasukkan saat Run Workflow!"
            exit 1
          }

          # Install resmi via Winget
          winget install --id Tailscale.Tailscale --exact --silent --accept-source-agreements --accept-package-agreements
          
          $env:Path += ";C:\Program Files\Tailscale"
          Start-Sleep -Seconds 5
          
          Write-Host "Menghubungkan ke Tailscale..."
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$key" --unattended --accept-routes

      - name: Keep Alive (RDP Active)
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host " RDP WIN 10 HIGH PERFORMANCE SIAP DIPAKAI "
          Write-Host " Username : runneradmin"
          Write-Host " Password : PasswordRDP123!"
          Write-Host "=========================================="
          $i = 0
          while ($i -lt 360) {
            Start-Sleep -Seconds 60
            $i++
            Write-Host "Status: RDP Berjalan ($i menit)"
          }
